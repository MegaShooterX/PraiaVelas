<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b1220" />
		<title>PraiaVelas</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%230b1220'/%3E%3Crect x='6' y='10' width='5' height='11' fill='%2322c55e'/%3E%3Crect x='13.5' y='13' width='5' height='9' fill='%23ef4444'/%3E%3Crect x='21' y='7' width='5' height='11' fill='%2322c55e'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="estilo.css" />
		<script type="module" src="principal.js"></script>
	</head>
	<body>
		<!-- For people who do not read charts: what the bot says first, the numbers folded (Rhuan, 08/11/2026). -->
		<header class="topo">
			<button id="inicio" class="marca" type="button" title="Início: o que o robô diz hoje">
				<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="9" width="5" height="12" fill="var(--up)" /><line x1="7.5" y1="5" x2="7.5" y2="25" stroke="var(--up)" stroke-width="1.6" /><rect x="13.5" y="13" width="5" height="9" fill="var(--down)" /><line x1="16" y1="10" x2="16" y2="26" stroke="var(--down)" stroke-width="1.6" /><rect x="22" y="6" width="5" height="11" fill="var(--up)" /><line x1="24.5" y1="3" x2="24.5" y2="20" stroke="var(--up)" stroke-width="1.6" /></svg>
				<strong>PraiaVelas</strong><small id="versao"></small>
			</button>
			<form id="busca" class="busca" autocomplete="off" role="search">
				<svg class="lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2" /><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
				<input id="codigo" name="codigo" placeholder="Buscar código (HGLG11, PETR4)" maxlength="12" autocapitalize="characters" spellcheck="false" enterkeyhint="search" aria-label="Código do ativo" />
				<button type="submit" title="Abrir" aria-label="Abrir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
			</form>
			
			<a id="testes" class="botao-icone" href="/experimentos/" title="Testes às cegas (relatórios)" aria-label="Testes às cegas" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
			</a>
			<button id="recarregar" class="botao-icone" type="button" title="Baixar de novo" aria-label="Baixar de novo">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
			</button>
		</header>
		<nav class="controles">
			<span class="rotulo">Prazo</span>
			<div id="perfis" class="segmentos" role="group" aria-label="Prazo da recomendação"></div>
		</nav>
		<main id="resultado"></main>
		<p class="aviso">Estudo estatístico e educativo, não é recomendação de investimento. O passado não garante o futuro.</p>
	</body>
</html>
